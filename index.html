Di era digital, menuntut ilmu semakin mudah melalui NgajiDiari dan sumber terpercaya. Namun kemudahan harus diiringi dengan adab dan seleksi sumber yang shahih.`,sumberKitab:"Kitab Ta'limul Muta'allim, Imam Az-Zarnuji",dalil:'"Barangsiapa menempuh jalan untuk mencari ilmu, maka Allah akan mudahkan baginya jalan menuju surga." (HR. Muslim)',tag:"ilmu, adab, niat",status:"Publish",tanggal:"2024-05-10",isLocalMock:!0},{id:"2",judul:"Fikih Wudhu: Rukun dan Sunnahnya",kategori:"Fiqih",cuplikan:"Memahami rukun wudhu dengan benar adalah syarat sahnya shalat kita sehari-hari.",isi:`Wudhu adalah kunci shalat. Rukun wudhu ada enam menurut madzhab Syafi'i: niat, membasuh wajah, membasuh kedua tangan sampai siku, mengusap sebagian kepala, membasuh kaki sampai mata kaki, dan tertib. Sunnah-sunnah wudhu memperindah dan menyempurnakan pahala, seperti membaca basmalah, bersiwak, mencuci telapak tangan di awal, berkumur dan istinsyaq, serta berdoa setelah wudhu.

Kesalahan umum adalah tergesa-gesa sehingga ada bagian yang tidak terbasuh. Pastikan air merata. Di musim dingin, gunakan air hangat secukupnya tanpa berlebih-lebihan (israf). Wudhu yang sempurna akan menjadi cahaya di hari kiamat.`,sumberKitab:"Kitab Fathul Qorib, Al-Qadhi Abu Syuja'",dalil:'"Sesungguhnya umatku akan datang pada hari kiamat dalam keadaan putih bercahaya karena bekas wudhu." (HR. Bukhari Muslim)',tag:"wudhu, thaharah, shalat",status:"Publish",tanggal:"2024-05-12",isLocalMock:!0},{id:"3",judul:"Sabar: Kunci Kelapangan Hati",kategori:"Akhlak",cuplikan:"Sabar bukan diam, tapi kekuatan menahan diri di atas ketaatan kepada Allah.",isi:`Sabar terbagi tiga: sabar dalam ketaatan, sabar menjauhi maksiat, dan sabar menghadapi musibah. Sabar adalah setengah dari iman. Ketika diuji dengan kesulitan rezeki, sakit, atau kehilangan, orang mukmin kembali kepada Allah dengan doa dan tawakal.

Latihan sabar bisa dimulai dari hal kecil: menahan lisan dari mengeluh, menahan amarah di jalan, dan konsisten bangun tahajud meski ngantuk. Buah dari sabar adalah ketenangan, karena hati yang sabar yakin bahwa Allah bersama orang-orang yang sabar.`,sumberKitab:"Kitab Ihya Ulumuddin, Imam Al-Ghazali",dalil:'"Wahai orang-orang yang beriman! Mohonlah pertolongan dengan sabar dan shalat. Sungguh, Allah beserta orang-orang yang sabar." (QS. Al-Baqarah: 153)',tag:"sabar, hati, tawakal",status:"Publish",tanggal:"2024-05-14",isLocalMock:!0},{id:"4",judul:"Kisah Hijrah Nabi: Pelajaran Strategi dan Tawakal",kategori:"Sirah",cuplikan:"Hijrah bukan sekadar pindah tempat, tapi perpindahan menuju ketaatan total.",isi:`Peristiwa hijrah dari Mekkah ke Madinah mengajarkan perencanaan yang matang sekaligus tawakal yang tinggi. Rasulullah SAW menyusun strategi: memilih Abu Bakar sebagai teman, menyiapkan Ali untuk mengecoh musyrikin, menggunakan jalur tidak biasa, dan bersembunyi di Gua Tsur.

Meski strategi maksimal, hati tetap bersandar pada Allah. Ketika Abu Bakar khawatir, Rasul berkata 'La tahzan innallaha ma'ana'. Inilah keseimbangan ikhtiar dan tawakal yang harus diteladani pemuda hari ini dalam dakwah dan kehidupan.`,sumberKitab:"Kitab Ar-Rahiqul Makhtum, Syaikh Al-Mubarakfuri",dalil:'"Jika kamu tidak menolongnya (Muhammad), sesungguhnya Allah telah menolongnya..." (QS. At-Taubah: 40)',tag:"hijrah, sirah, tawakal",status:"Publish",tanggal:"2024-05-16",isLocalMock:!0},{id:"5",judul:"Adab Membaca Al-Qur'an yang Sering Terlupakan",kategori:"Qur'an",cuplikan:"Membaca Al-Qur'an bukan sekadar tartil, tapi juga menghadirkan hati.",isi:`Di antara adab membaca Al-Qur'an: bersuci, menghadap kiblat, membaca ta'awudz, dengan tartil dan tadabbur, tidak tergesa-gesa mengejar khatam. Imam Nawawi menyebutkan bahwa menangis atau berusaha menangis ketika membaca ayat azab dan rahmat adalah adab yang utama.

Gunakan mushaf yang bersih, jangan meletakkan barang di atasnya. Niatkan setiap huruf sebagai pahala. Satu huruf sepuluh kebaikan. Jika istiqomah satu juz per hari, maka dalam sebulan bisa khatam. NgajiDiari membantu mencatat tadabbur harian agar bacaan tidak sekadar lewat.`,sumberKitab:"Kitab At-Tibyan fi Adabi Hamalatil Qur'an, Imam Nawawi",dalil:`"Dan bacalah Al-Qur'an itu dengan perlahan-lahan." (QS. Al-Muzzammil: 4)`,tag:"quran, adab, tadabbur",status:"Publish",tanggal:"2024-05-18",isLocalMock:!0},{id:"6",judul:"Birrul Walidain di Tengah Kesibukan",kategori:"Akhlak",cuplikan:"Ridha Allah terletak pada ridha orang tua, meski kita sudah berkeluarga dan bekerja.",isi:`Birrul walidain adalah amal yang paling dicintai setelah shalat tepat waktu. Bentuknya tidak harus materi besar: menelepon rutin, mendengarkan cerita mereka, membantu pekerjaan rumah saat pulang, dan mendoakan setiap selesai shalat.

Jika orang tua sudah tiada, bakti tetap bisa dilakukan dengan menyambung silaturahmi teman-teman mereka, bersedekah atas nama mereka, dan menjaga nama baik keluarga. Jangan meninggikan suara di atas suara mereka. Lemah lembut adalah kunci.`,sumberKitab:"Kitab Al-Adab Al-Mufrad, Imam Bukhari",dalil:'"Dan Kami perintahkan kepada manusia agar berbuat baik kepada kedua orang tuanya." (QS. Luqman: 14)',tag:"orang tua, birrul walidain, keluarga",status:"Publish",tanggal:"2024-05-20",isLocalMock:!0},{id:"7",judul:"Fiqih Muamalah: Prinsip Halal dalam Jual Beli Online",kategori:"Fiqih",cuplikan:"Transaksi online tetap wajib memenuhi rukun jual beli dalam Islam.",isi:`Dalam jual beli online, harus jelas: barangnya (ma'qud alaih), harganya, dan akadnya. Hindari gharar (ketidakjelasan) seperti menjual barang yang belum dimiliki. Hindari riba dalam sistem pembayaran paylater yang berbunga. Gunakan akad yang transparan.

Penjual wajib jujur menjelaskan cacat barang. Pembeli wajib membayar tepat waktu. Dengan prinsip ini, jual beli menjadi berkah. Rezeki yang halal akan menenangkan hati dan mendatangkan keberkahan keluarga.`,sumberKitab:"Kitab Fiqih Muamalah Kontemporer, Dr. Wahbah Az-Zuhaili",dalil:'"Wahai orang-orang yang beriman, janganlah kamu saling memakan harta sesamamu dengan jalan yang batil..." (QS. An-Nisa: 29)',tag:"muamalah, halal, jual beli",status:"Publish",tanggal:"2024-05-22",isLocalMock:!0},{id:"8",judul:"Dzikir Pagi Petang: Benteng Seorang Mukmin",kategori:"Aqidah",cuplikan:"Dzikir pagi petang adalah tameng dari keburukan dan penenang jiwa.",isi:`Imam Ibnul Qayyim berkata, dzikir pagi petang ibarat baju besi bagi pejuang. Di antara dzikir yang shahih: Ayat Kursi, Al-Ikhlas, Al-Falaq, An-Nas tiga kali, Sayyidul Istighfar, dan doa perlindungan. Waktunya setelah Subuh hingga terbit matahari, dan setelah Ashar hingga Maghrib.
