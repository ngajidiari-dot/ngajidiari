Rasulullah ﷺ bersabda: "Barangsiapa menempuh jalan untuk mencari ilmu, maka Allah akan memudahkan baginya jalan menuju surga." (HR. Muslim).

Di era informasi yang berlimpah, menuntut ilmu bukan sekadar mengumpulkan data, tapi menjaga niat. Aqidah yang lurus menjadi fondasi: belajar karena Allah, bukan karena ingin terlihat pintar.

Tiga adab utama:
1. Meluruskan niat sebelum membuka kitab.
2. Mencatat dengan hati, bukan hanya pena.
3. Mengamalkan walau satu ayat.

Ilmu yang diamalkan akan menjadi cahaya di setiap langkah, dan itulah yang dijaga NgajiDiari.`,ImageUrl:"https://images.unsplash.com/photo-1512820790803-83ca734da794?q=80&w=800&auto=format&fit=crop",Badge:"Aqidah"},{id:"2",Title:"Fiqih Wudhu di Era Modern: Hemat Air Tetap Sah?",Category:"Fiqih kontemporer",Date:"2024-05-09",Excerpt:"Bagaimana hukum wudhu dengan spray, keran sensor, dan ketika air terbatas? Kajian fiqih praktis untuk keseharian.",Content:`Wudhu adalah kunci shalat. Namun di gedung tinggi, di pesawat, di alam—bagaimana fiqih menjawab tantangan modern?

Para ulama kontemporer sepakat: sahnya wudhu tidak ditentukan banyaknya air, tapi sampainya air ke anggota wajib. Rasulullah berwudhu dengan satu mud (sekitar 0,6 liter).

Praktik hemat:
• Gunakan keran kecil
• Spray untuk usapan kepala cukup jika membasahi
• Jika luka, cukup mengusap perban (masah)

Yang terpenting: tertib, niat, dan tidak berlebihan.`,ImageUrl:"https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?q=80&w=800&auto=format&fit=crop",Badge:"Fiqih"},{id:"3",Title:"Menjaga Hati di Tengah Hiruk Pikuk Kota",Category:"Nafisyah",Date:"2024-05-08",Excerpt:"Nafisyah — renungan harian agar hati tetap lembut meski dunia bising dan notifikasi tak berhenti.",Content:`Hati itu seperti cermin. Jika jarang dibersihkan, ia buram.

Di tengah notifikasi, deadline, dan macet, kita butuh jeda. Bukan liburan panjang, tapi jeda 2 menit untuk dzikir.

Latihan hari ini:
Pagi: Istighfar 33x sambil menunggu kopi.
Siang: Tatap langit 10 detik, ucap "Subhanallah".
Malam: Tulis satu nikmat yang hari ini terlewat.

Ketenangan bukan karena masalah hilang, tapi karena hati kembali pulang kepada-Nya.`,ImageUrl:"https://images.unsplash.com/photo-1511108690759-009324a90311?q=80&w=800&auto=format&fit=crop",Badge:"Nafisyah"},{id:"4",Title:"Memahami Qadha dan Qadar Tanpa Fatalisme",Category:"Aqidah & Pemikiran",Date:"2024-05-07",Excerpt:"Antara ikhtiar maksimal dan tawakal total — di mana posisi kita sebagai hamba yang berakal?",Content:`Banyak yang salah paham: kalau semua sudah ditakdirkan, untuk apa berusaha?

Aqidah Ahlus Sunnah mengajarkan: iman kepada qadar adalah mengimani bahwa Allah Maha Mengetahui, Maha Menulis, Maha Berkehendak, dan Maha Mencipta.

Tapi kita tetap diperintah ikhtiar. Seperti petani yang menanam, menyiram, lalu tawakal soal panen.`,ImageUrl:"https://images.unsplash.com/photo-1456513080510-7bf3a84b82f8?q=80&w=800&auto=format&fit=crop",Badge:"Aqidah"},{id:"5",Title:"Fiqih Muamalah Digital: Jual Beli di Marketplace",Category:"Fiqih kontemporer",Date:"2024-05-06",Excerpt:"Akad, gharar, dan ulasan palsu — bagaimana Islam memandang transaksi online yang serba cepat ini?",Content:`Jual beli online sah selama memenuhi rukun: penjual-pembeli jelas, barang halal dan diketahui sifatnya, ijab-qabul terjadi (klik checkout adalah ijab modern), dan tidak ada gharar berlebihan.

Yang perlu dihindari:
1. Foto tidak sesuai barang (tadlis)
2. Ulasan palsu
3. Dropship tanpa kejelasan kepemilikan

Solusi: jujur deskripsikan kekurangan, cantumkan akad jelas, dan berikan khiyar (hak retur).`,ImageUrl:"https://images.unsplash.com/photo-1460925895917-afdab827c52f?q=80&w=800&auto=format&fit=crop",Badge:"Fiqih"},{id:"6",Title:"Ikhlas: Kunci Ketenangan Jiwa di Era Pencitraan",Category:"Nafisyah",Date:"2024-05-05",Excerpt:"Saat amal terasa berat, mungkin yang lelah bukan tubuh, tapi niat yang mulai bergeser karena ingin dilihat.",Content:`Ikhlas itu seperti akar pohon: tidak terlihat, tapi menentukan hidup matinya.

Tanda ikhlas mulai luntur: mudah tersinggung jika tidak dipuji, semangat hanya saat dilihat orang.

Cara merawat ikhlas:
- Sembunyikan kebaikanmu seperti kau sembunyikan aibmu.
- Ingat: yang menilai amal adalah Allah, bukan algoritma.
- Perbanyak amal yang tidak ada yang tahu kecuali kamu dan Dia.`,ImageUrl:"https://images.unsplash.com/photo-1506126613408-eca07ce68773?q=80&w=800&auto=format&fit=crop",Badge:"Nafisyah"}],Ja=["Aqidah & Pemikiran","Fiqih kontemporer","Nafisyah"],pK=6;function Ya(o){let e=o.trim().split(`
