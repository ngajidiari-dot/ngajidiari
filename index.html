dalah cahaya yang membimbing manusia dari kegelapan jahiliyah. Seseorang yang bersungguh-sungguh dalam majelis ilmu akan mendapatkan keberkahan waktu dan kelapangan hati. Ilmu yang diamalkan menjadi cahaya, dan cahaya itu akan menuntun setiap langkah di dunia hingga akhirat. Adab sebelum ilmu, niat yang lurus, dan kesabaran dalam menghafal adalah kunci utama.",category:"Aqidah & Pemikiran",badge:"Aqidah",date:"2024-05-10",source:"Kitab Ta'limul Muta'allim",image:aa},{id:"2",title:"Memahami Tauhid Rububiyah dan Uluhiyah",excerpt:"Pondasi akidah yang kokoh dimulai dari mengenal Allah sebagai Rabb dan Ilah satu-satunya.",content:"Tauhid adalah inti dari dakwah seluruh Nabi. Rububiyah meyakini Allah sebagai Pencipta, Pemberi rezeki, dan Pengatur alam. Uluhiyah adalah mengesakan Allah dalam ibadah. Dua sisi ini tidak bisa dipisahkan. Ketika hati benar-benar mengenal Rububiyah, maka ia akan tunduk dalam Uluhiyah. Kajian ini mengajak kita kembali memurnikan niat ibadah hanya untuk Allah.",category:"Aqidah & Pemikiran",badge:"Aqidah",date:"2024-05-08",source:"Kitab Al-Aqidah Ath-Thahawiyah",image:Nu},{id:"3",title:"Hukum Muamalah di Era Digital",excerpt:"Bagaimana Islam memandang transaksi online, kripto, dan akad-akad kontemporer yang belum ada di zaman klasik.",content:"Fiqih kontemporer menuntut kejelian dalam memahami illat hukum. Transaksi digital tetap harus memenuhi rukun jual beli: ada penjual, pembeli, barang yang halal, dan sighat yang jelas. Gharar dan riba menjadi dua hal yang wajib dihindari. Para ulama kontemporer membahas e-wallet, paylater, dan aset digital dengan kaidah 'al-ashlu fil mu'amalah al-ibahah' selama tidak ada dalil yang mengharamkan.",category:"Fiqih kontemporer",badge:"Fiqih",date:"2024-05-06",source:"Kitab Fiqih Muamalah Kontemporer",image:zu},{id:"4",title:"Adab Berselisih dalam Masalah Fiqih",excerpt:"Perbedaan pendapat adalah rahmat, selama adab tetap dijaga dan dalil menjadi rujukan utama.",content:"Imam Syafi'i dan Imam Malik berbeda pendapat namun saling mendoakan. Inilah adab ikhtilaf yang hilang hari ini. Fiqih kontemporer bukan untuk memecah belah, tapi untuk memberi keluasan. Kunci adab berselisih: tidak mencela, tidak mengklaim paling benar, dan mengembalikan kepada Al-Qur'an dan Sunnah dengan pemahaman salaf.",category:"Fiqih kontemporer",badge:"Fiqih",date:"2024-05-04",source:"Kitab Al-Inshaf",image:sa},{id:"5",title:"Tazkiyatun Nafs: Membersihkan Hati",excerpt:"Hati yang bersih adalah wadah ilmu. Tanpa tazkiyah, ilmu hanya menjadi beban.",content:"Nafisyah mengajarkan kita bahwa ilmu tanpa penyucian jiwa akan melahirkan kesombongan. Tazkiyatun nafs dimulai dari muhasabah harian, istighfar, dan mengurangi cinta dunia. Imam Al-Ghazali menekankan bahwa hati ibarat cermin, dosa adalah debu yang menutupinya. Majelis ilmu bukan hanya transfer informasi, tapi proses pencucian hati.",category:"Nafisyah",badge:"Nafisyah",date:"2024-05-02",source:"Kitab Ihya Ulumuddin",image:Ir},{id:"6",title:"Sabar dan Syukur dalam Ujian Hidup",excerpt:"Dua sayap yang membuat seorang mukmin tetap terbang di tengah badai kehidupan.",content:"Nafisyah mengajarkan keseimbangan. Sabar saat diuji, syukur saat diberi nikmat. Rasulullah bersabda, 'Sungguh menakjubkan urusan orang mukmin'. Keduanya adalah ibadah hati yang tidak terlihat namun pahalanya besar. Diari harian untuk mencatat rasa sabar dan syukur membantu kita melihat pola pertumbuhan ruhani.",category:"Nafisyah",badge:"Nafisyah",date:"2024-04-28",source:"Kitab Madarijus Salikin",image:Pu},{id:"7",title:"Kewajiban Menjaga Lisan dan Hati",excerpt:"Aqidah yang lurus tercermin dari penjagaan lisan, karena lisan adalah penerjemah hati.",content:"Aqidah bukan hanya dihafal, tapi dijaga. Lisan yang tidak dijaga bisa merusak akidah dengan kalimat kufur, ghibah, atau dusta. Hati yang tidak dijaga akan dipenuhi hasad dan ujub. Menuntut ilmu adalah cara menjaga keduanya, karena ilmu memberi rambu mana yang boleh diucap dan mana yang harus disimpan.",category:"Aqidah & Pemikiran",badge:"Aqidah",date:"2024-04-25",source:"Kitab Al-Adzkar",image:fa},{id:"8",title:"Fiqih Wudhu dan Shalat Musafir",excerpt:"Keringanan yang Allah berikan untuk musafir adalah bentuk kasih sayang dalam syariat.",content:"Fiqih kontemporer juga membahas thaharah dan shalat bagi pekerja yang sering bepergian. Jama' dan qashar memiliki syarat jarak dan niat safar. Wudhu dengan keterbatasan air, tayamum di pesawat, dan arah kiblat dengan kompas digital adalah isu yang dibahas ulama hari ini dengan tetap berpegang pada dalil.",category:"Fiqih kontemporer",badge:"Fiqih",date:"2024-04-20",source:"Kitab Safinatun Najah",image:ad},{id:"9",title:"Mendidik Generasi Qur'ani di Rumah",excerpt:"Peran orang tua dalam menanamkan akidah lurus sejak dini melalui teladan dan kisah.",content:"Mendidik anak bukan hanya soal hafalan, tapi penanaman makna. Kisah para Nabi, pembiasaan doa harian, dan dialog tauhid sederhana di meja makan akan membekas lebih lama daripada ceramah panjang. Aqidah yang ditanam dengan kasih akan tumbuh menjadi keyakinan.",category:"Aqidah & Pemikiran",badge:"Aqidah",date:"2024-04-18",source:"Kitab Tarbiyatul Aulad",image:Nu},{id:"10",title:"Kajian Kitab Al-Waraqat: Ushul Fiqih Pemula",excerpt:"Pengenalan ringkas tentang ushul fiqih sebagai alat memahami dalil.",content:"Ushul fiqih adalah jembatan antara nash dan istinbath hukum. Kitab Al-Waraqat karya Imam Al-Juwaini sangat cocok untuk pemula. Membahas definisi hukum, macam-macam dalil, dan kaidah tarjih yang membantu kita tidak mudah menyalahkan perbedaan.",category:"Fiqih kontemporer",badge:"Fiqih",date:"2024-04-16",source:"Kitab Al-Waraqat",image:zu},{id:"11",title:"Muhasabah Harian: Cara Praktis",excerpt:"Teknik 5 menit muhasabah sebelum tidur yang diajarkan ulama tasawuf.",content:"Ambil buku kecil, tulis 3 syukur hari ini, 2 kesalahan yang ingin diperbaiki, dan 1 niat untuk esok. Kebiasaan kecil ini adalah tazkiyatun nafs modern yang menjaga hati tetap hidup.",category:"Nafisyah",badge:"Nafisyah",date:"2024-04-14",source:"Kitab Risalah Mu'awanah",image:Ir},{id:"12",title:"Menjawab Syubhat Modern tentang Takdir",excerpt:"Antara ikhtiar dan tawakal: meluruskan paham jabariyah dan qadariyah masa kini.",content:"Takdir bukan alasan untuk bermalas-malasan. Rasulullah mengajarkan ikhtiar maksimal dengan tawakal total. Syubhat modern sering membenturkan sains dan takdir, padahal keduanya berjalan dalam iradah Allah.",category:"Aqidah & Pemikiran",badge:"Aqidah",date:"2024-04-12",source:"Kitab Syarh Aqidah Thahawiyah",image:fa},{id:"13",title:"Fiqih Puasa Ramadhan dan Qadha",excerpt:"Ringkasan praktis tentang niat, pembatal, dan qadha puasa bagi pekerja berat.",content:"Niat puasa Ramadhan wajib di malam hari, namun bagi yang lupa ada rincian khilaf ulama. Pekerja berat yang tidak mampu tetap wajib mengqadha, bukan langsung fidyah, kecuali ada udzur syar'i yang berkelanjutan.",category:"Fiqih kontemporer",badge:"Fiqih",date:"2024-04-10",source:"Kitab Fathul Mu'in",image:sa},{id:"14",title:"Mengobati Penyakit Hasad",excerpt:"Hasad memakan kebaikan seperti api memakan kayu bakar.",content:"Obat hasad adalah menyadari bahwa rezeki Allah tidak akan tertukar. Mendoakan keberkahan untuk orang yang kita hasad, memperbanyak syukur, dan mengurangi melihat media yang memicu iri adalah langkah praktis nafisyah.",category:"Nafisyah",badge:"Nafisyah",date:"2024-04-08",source:"Kitab Bidayatul Hidayah",image:Pu},{id:"15",title:"Prinsip Ahlus Sunnah dalam Menyikapi Bid'ah",excerpt:"Tegas dalam prinsip, lembut dalam dakwah.",content:"Ahlus Sunnah membedakan antara bid'ah hakiki dan idhafiyah, serta menimbang maslahat dan mafsadat dalam mengingkari. Dakwah harus dengan ilmu dan hikmah, bukan dengan caci maki.",category:"Aqidah & Pemikiran",badge:"Aqidah",date:"2024-04-06",source:"Kitab Al-I'tisham",image:aa},{id:"16",title:"Transaksi Paylater dalam Kacamata Fiqih",excerpt:"Kapan paylater menjadi riba dan kapan menjadi jual beli kredit yang halal?",content:"Jika ada tambahan denda keterlambatan yang disyaratkan di awal, maka itu riba. Jika jual beli kredit dengan harga lebih tinggi tanpa denda, sebagian ulama membolehkan dengan syarat jelas dan tidak ada gharar.",category:"Fiqih kontemporer",badge:"Fiqih",date:"2024-04-04",source:"Kitab Fiqih Kontemporer - Paylater",image:ad},{id:"17",title:"Ikhlas: Ruh dari Setiap Amal",excerpt:"Tanpa ikhlas, amal sebesar gunung pun menjadi debu.",content:"Ikhlas adalah memurnikan amal hanya untuk Allah. Tandanya: tidak mencari pujian, tidak sedih jika tidak dikenal, dan tetap semangat meski sendiri. Diari keikhlasan membantu kita mengecek niat setiap pagi.",category:"Nafisyah",badge:"Nafisyah",date:"2024-04-02",source:"Kitab Al-Hikam",image:Ir},{id:"18",title:"Mengenal Al-Asmaul Husna untuk Ketenangan Hati",excerpt:"Menghafal nama Allah bukan sekadar lisan, tapi menghidupkannya dalam doa.",content:"Saat cemas, panggil Ya Salam. Saat butuh rezeki, panggil Ya Razzaq. Memahami Asmaul Husna adalah terapi nafisyah yang paling dalam, karena hati yang mengenal Rabb-nya akan tenang.",category:"Aqidah & Pemikiran",badge:"Aqidah",date:"2024-03-30",source:"Kitab Fiqhul Asmaul Husna",image:Nu},{id:"19",title:"Fiqih Zakat Penghasilan Freelancer",excerpt:"Bagaimana menghitung zakat untuk penghasilan tidak tetap?",content:"Zakat penghasilan freelancer diqiyaskan ke zakat pertanian atau perdagangan tergantung akad. Jika sudah mencapai nisab dan haul, wajib dikeluarkan 2,5%. Pencatatan harian membantu memudahkan hisab akhir tahun.",category:"Fiqih kontemporer",badge:"Fiqih",date:"2024-03-28",source:"Kitab Zakat Kontemporer",image:zu},{id:"20",title:"Seni Bersabar Saat Dakwah Ditolak",excerpt:"Dakwah bukan tentang diterima, tapi tentang menyampaikan dengan hikmah.",content:"Nabi Nuh berdakwah 950 tahun. Penolakan bukan kegagalan. Sabar dalam dakwah adalah nafisyah tingkat tinggi: menjaga hati tetap lembut meski lisan orang lain tajam.",category:"Nafisyah",badge:"Nafisyah",date:"2024-03-26",source:"Kitab Qashashul Anbiya",image:Pu},{id:"21",title:"Aqidah dan Akhlak: Dua Sisi Koin",excerpt:"Tidak sempurna akidah seseorang sampai akhlaknya mencerminkan ilmunya.",content:"Rasulullah diutus untuk menyempurnakan akhlak. Aqidah yang benar akan melahirkan akhlak mulia: jujur, amanah, dan kasih sayang. Jika akidah lurus tapi lisan kasar, ada yang perlu diperbaiki di hati.",category:"Aqidah & Pemikiran",badge:"Aqidah",date:"2024-03-24",source:"Kitab Akhlak Nabawi",image:fa},{id:"22",title:"Hukum Penggunaan AI untuk Fatwa",excerpt:"Bolehkah bertanya hukum agama kepada AI?",content:"AI boleh sebagai alat bantu pencarian, tapi fatwa tetap harus dari ulama yang memahami konteks. Fiqih kontemporer menekankan pentingnya mujtahid hidup, bukan hanya teks.",category:"Fiqih kontemporer",badge:"Fiqih",date:"2024-03-22",source:"Kitab Fiqih Teknologi",image:sa},{id:"23",title:"Menjaga Hati di Era Media Sosial",excerpt:"Scroll yang tak terkontrol adalah pintu masuk penyakit hati.",content:"Batasi waktu, pilih akun yang memberi ilmu, dan biasakan dzikir setelah scroll. Nafisyah di era digital adalah kemampuan menutup aplikasi sebelum hati rusak.",category:"Nafisyah",badge:"Nafisyah",date:"2024-03-20",source:"Kitab Adab Digital",image:Ir},{id:"24",title:"Tauhid dan Kebebasan Berpikir",excerpt:"Islam tidak anti akal, tapi menempatkan akal pada tempatnya.",content:"Akal adalah alat, wahyu adalah panduan. Kebebasan berpikir dalam Islam dibatasi oleh tauhid, agar tidak menjadi kesombongan intelektual yang menolak kebenaran.",category:"Aqidah & Pemikiran",badge:"Aqidah",date:"2024-03-18",source:"Kitab Manhaj Aqli",image:aa},{id:"25",title:"Adab Menuntut Ilmu di Majelis",excerpt:"Duduk, diam, catat, amalkan - urutan yang sering dilupakan.",content:"Adab majelis adalah kunci keberkahan ilmu. Datang lebih awal, tidak memotong pembicaraan guru, mencatat dengan rapi, dan langsung mengamalkan satu poin setiap majelis.",category:"Aqidah & Pemikiran",badge:"Aqidah",date:"2024-03-16",source:"Kitab Adab Thalibil Ilmi",image:Nu},{id:"26",title:"Fiqih Hewan Qurban Patungan Online",excerpt:"Bolehkah patungan qurban via aplikasi?",content:"Patungan qurban sapi untuk 7 orang tetap sah meski via online, selama akad jelas, hewan memenuhi syarat, dan penyembelihan dilakukan sesuai syariat. Bukti transfer bukan pengganti akad.",category:"Fiqih kontemporer",badge:"Fiqih",date:"2024-03-14",source:"Kitab Fiqih Qurban",image:zu},{id:"27",title:"Dzikir Pagi Petang: Benteng Hati",excerpt:"Dua waktu yang jika dijaga, hati terjaga sepanjang hari.",content:"Dzikir pagi petang adalah benteng. Meski singkat, jika rutin, ia menjaga dari gundah, malas, dan waswas. Mulai dari 3 Qul, Ayat Kursi, dan doa perlindungan.",category:"Nafisyah",badge:"Nafisyah",date:"2024-03-12",source:"Kitab Al-Adzkar An-Nawawi",image:Pu},{id:"28",title:"Tawadhu: Lawan dari Ujub",excerpt:"Semakin berilmu, semakin merasa kecil di hadapan Allah.",content:"Tawadhu bukan merendahkan diri palsu, tapi menyadari bahwa ilmu dan amal kita tidak ada apa-apanya dibanding nikmat Allah. Orang tawadhu mudah menerima nasihat dan tidak mudah tersinggung.",category:"Nafisyah",badge:"Nafisyah",date:"2024-03-10",source:"Kitab Minhajul Qashidin",image:Ir}],sd=[{name:"Aqidah & Pemikiran",icon:Wr,short:"Aqidah"},{name:"Fiqih kontemporer",icon:nt,short:"Fiqih"},{name:"Nafisyah",icon:tt,short:"Nafisyah"}],ca="https://images.unsplash.com/photo-1481627834876-b7833e8f5570?w=600&auto=format&fit=crop&q=80";var t1=fd.map((e)=>({...e,image:`${e.image}#uid-${e.id}`}));function da(){let[e,n]=L.useState(t1),[t,r]=L.useState("Aqidah & Pemikiran"),[l,u]=L.useState(""),[o,i]=L.useState(new Set),[a,d]=L.useState(null),[y,g]=L.useState(!1),[m,E]=L.useState(""),[_,z]=L.useState(!1),[U,p]=L.useState(null),[s,v]=L.useState(0),[S,P]=L.useState(""),O=L.useRef(null),D=L.useRef(null),[T,Q]=L.useState(1),V=9,[F,oe]=L.useState({title:"",excerpt:"",content:"",category:"Aqidah & Pemikiran",badge:"Aqidah",date:new Date().toISOString().slice(0,10),source:"",image:""}),[rt,pa]=L.useStat
